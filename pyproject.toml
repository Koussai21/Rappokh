[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rappokh"
version = "0.1.0"
description = "AI-powered report generator using Claude, OpenAI, and Perplexity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Rappokh Team" }
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.28.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]
